apply plugin: 'com.android.application'
//apply from: 'https://gist.githubusercontent.com/IlyaEremin/8821fbf0069e8e60dfeaeefc19afaca2/raw/ce54be4ea6f19b9609f303cd75714d6ec8d916e5/app_version.gradle'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace 'com.mitwill.erp'
    compileSdk 35

    signingConfigs {
        config {
            keyAlias 'mitwill'
            keyPassword 'android'
            storeFile file('../mitwill-eos.jks')
            storePassword 'android'
        }
    }
    defaultConfig {
        useLibrary 'org.apache.http.legacy'
        vectorDrawables.useSupportLibrary = true
        manifestPlaceholders = [applicationName: "Mitwill ERP"]
        applicationId "com.mitwill.erp"
        minSdk 21
        targetSdk 35
        versionCode appVersionCode.toInteger()
        versionName appVersionName
    }
    buildTypes {
        debug {
            manifestPlaceholders = [applicationName: "TEST Mitwill ERP", sentryEnvironment: "debug", sentryDebug: "true"]
            applicationIdSuffix ".debug"
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.config
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue "string", "server_url", "https://test-eos.mitwill.com"
            resValue "string", "server_database_name", "mitwill_prod_copy"
//            resValue "string", "server_database_name", "mitwill_test_new_db"
        }
        release {
            manifestPlaceholders = [sentryEnvironment: "release",sentryDebug: "false"]
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            resValue "string", "server_url", "https://eos.mitwilltextiles.com"
            resValue "string", "server_database_name", "mitwill_prod"
        }
        local {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            resValue "string", "server_url", ""
            resValue "string", "server_database_name", ""
            debuggable true
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "mitwill-${variant.name}-V${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Material
    implementation 'com.google.android.material:material:1.12.0'

    // Networking / UI utilities
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'com.github.clans:fab:1.6.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Glide + transformations + GPU image
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'jp.co.cyberagent.android:gpuimage:2.1.0'

    // ButterKnife (legacy view binding, deprecated but still in use here)
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    // Image / utility libs (legacy)
    implementation 'com.github.jkwiecien:EasyImage:1.3.1'
    implementation 'com.github.tajchert:nammu:1.2.1'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'

    // Firebase (managed by BoM)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    //sentry-android for tracking
//    implementation 'io.sentry:sentry-android:4.2.0'
    implementation 'io.sentry:sentry-android:7.22.5'
}
